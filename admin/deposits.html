<!DOCTYPE html>
<html>
<head>
<title>Admin Deposits</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f7fb;
}

/* TOP BAR */
.topbar{
    background:linear-gradient(135deg,#0099ff,#0066ff);
    color:white;
    padding:15px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

/* CARD */
.card{
    background:white;
    margin:12px;
    padding:12px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

/* TEXT */
p{
    margin:6px 0;
    font-size:14px;
}

/* IMAGE */
img{
    width:100%;
    max-width:280px;
    border-radius:10px;
    margin-top:10px;
}

/* BUTTONS */
button{
    padding:8px 10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    margin:3px;
}

.approve{
    background:#00c853;
    color:white;
}

.reject{
    background:#ff4d4d;
    color:white;
}

/* BACK BUTTON */
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
}

.bottom a{
    flex:1;
}

.bottom button{
    width:100%;
    border-radius:0;
    background:#0099ff;
    color:white;
    padding:12px;
}
</style>
</head>

<body>

<div class="topbar">
Deposit Approval Panel
</div>

<div id="deposits"></div>

<div class="bottom">
<a href="dashboard.html">
<button>⬅️ Admin Dashboard</button>
</a>
</div>

<script>

const API = "https://mobile-wealth-api.onrender.com";

async function loadDeposits() {

    try {
        const res = await fetch(`${API}/admin/deposits`);

        const text = await res.text();

        console.log("RAW RESPONSE:", text);

        let data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            console.log("NOT JSON (SERVER ERROR):", text);
            return;
        }

        const container = document.getElementById("deposits");

        if (!container) {
            console.log("Missing #deposits container");
            return;
        }

        container.innerHTML = "";

        data.forEach(dep => {
            container.innerHTML += `
                <div>
                    <p>${dep.phone}</p>
                    <p>${dep.amount}</p>
                </div>
            `;
        });

    } catch (err) {
        console.log("FETCH ERROR:", err);
    }
}

loadDeposits();

</script>

</body>
</html>
