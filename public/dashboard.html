<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    overflow-x:hidden;
}


/* HEADER */

.header{

    background:linear-gradient(135deg,#0099ff,#0066cc);
    color:white;
    padding:18px;

}


/* ADVERT */

.dashboard-ad{

    width:100%;
    padding:10px 15px;

}


.dashboard-ad img{

    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);

}



/* CONTAINER */

.container{

    width:100%;
    max-width:600px;
    margin:auto;
    padding:15px;
    padding-bottom:130px;

}



/* GRID */

.grid{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;

}



.card{

    background:skyblue;
    padding:15px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.full{

    grid-column:span 2;

}



.card h2{

    font-size:14px;
    margin:0;
    color:#555;

}



.value{

    font-size:20px;
    font-weight:bold;
    margin-top:8px;

}



#balance{

    color:#8b4513;

}


#totalInvested{

    color:#d4af37;

}


.returns{

    color:#00c853;

}



/* GENERAL BUTTON */

button{

    padding:12px;
    border:none;
    border-radius:10px;
    background:#0099ff;
    color:white;
    font-weight:bold;
    cursor:pointer;

}



/* DEPOSIT & WITHDRAW BUTTON AREA */

.action-buttons{

    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin:20px 0;

}


.action-buttons button{

    width:130px;
    height:60px;
    border-radius:15px;
    font-size:14px;

}



/* BONUS BOX */

#bonusBox{

    width:150px;
    margin:15px auto;
    background:#fff3cd;
    padding:12px;

    border-radius:12px;

    box-shadow:0 4px 5px rgba(0,0,0,.2);

    font-size:12px;

}


#bonusBox input{

    width:100%;
    padding:6px;

}




/* REFERRAL BOX */


.ref-box{

    width:90%;
    max-width:500px;

    margin:15px auto;

    background:white;

    padding:12px;

    border-radius:10px;

}



.ref-box input{

    width:100%;
    padding:8px;

}





/* NORMAL BUTTON LINKS */


.action-links{

    text-align:center;
    padding:10px;

}


.about-btn,
.help-btn,
.myinvestment-btn{

    display:inline-block;

    padding:8px 12px;

    border-radius:20px;

    text-decoration:none;

    color:white;

    font-size:12px;

    font-weight:bold;

    margin:5px;

}



.about-btn{

    background:#876026;

}



.help-btn{

    background:#53ed6d;

}



.myinvestment-btn{

    background:#53ed6d;

}




/* BOTTOM NAV */


.bottom-nav{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    background:#bfc3ce;

    display:flex;

    justify-content:space-around;

    padding:5px;

    z-index:9999;

}



.bottom-nav a{

    flex:1;

    text-align:center;

    text-decoration:none;

    color:#333;

    font-size:9px;

}



.bottom-nav span{

    display:block;

    font-size:14px;

}



/* TIME */


.top-time{

    position:fixed;

    top:5px;

    right:5px;

    background:white;

    padding:5px;

    border-radius:8px;

    font-size:10px;

    z-index:999;

}



/* MOBILE */

@media(max-width:600px){

.grid{

    grid-template-columns:1fr;

}


.full{

    grid-column:span 1;

}

.dashboard-ad img{

    height:150px;

}


.action-buttons button{

    width:120px;
    height:55px;

}

.container{

    padding:10px;

}

}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div>
        <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
        style="width:35px;height:35px;background:white;border-radius:50%;padding:3px;">
    </div>

    <div style="margin-top:8px;font-size:15px;">
        Welcome <span id="welcome"></span>
    </div>

</div>



<!-- DASHBOARD ADVERT -->

<div class="dashboard-ad">

<img src="images/investment1.jpeg"
alt="Mobile Wealth Advert">

</div>



<div class="top-time">

<div id="date"></div>

<div id="time"></div>

</div>




<div class="container">


<div class="grid">


<div class="card">

<h2>Balance</h2>

<div class="value" id="balance">₦0</div>

</div>



<div class="card">

<h2>Returns</h2>

<div class="value returns" id="returns">₦0</div>

</div>




<div class="card full">

<h2>Total Invested</h2>

<div class="value" id="totalInvested">₦0</div>

</div>


</div>



<!-- DEPOSIT AND WITHDRAW -->

<div class="action-buttons">

<button onclick="location.href='deposit.html'">
💰 Deposit
</button>


<button onclick="location.href='Withdraw.html'">
💸 Withdraw
</button>

</div>





<!-- BONUS -->

<div id="bonusBox">

<b>🎁 Bonus</b>

<br><br>

<input id="bonusCode"
placeholder="Enter code">


<br><br>

<button onclick="claimBonus()">
Accept
</button>

</div>






<!-- REFERRAL -->

<div class="ref-box">

<h3>Your Referral Link</h3>

<input id="refLink" readonly>


<br><br>

<button onclick="copyLink()">
Copy Link
</button>


</div>


</div>






<!-- NORMAL BUTTON AREA -->

<div class="action-links">


<a href="about.html" class="about-btn">
About
</a>


<a href="help.html" class="help-btn">
Forum
</a>


<a href="myinvestment.html" class="myinvestment-btn">
MY 🛍️ INVESTMENT
</a>


</div>








<!-- BOTTOM NAV -->

<div class="bottom-nav">


<a href="deposit.html">

<span>💰</span>
DEP

</a>


<a href="products.html">

<span>🛍️</span>
PRODUCT

</a>


<a href="Transactions.html">

<span>📊</span>
HISTORY

</a>


<a href="referral-commission.html">

<span>🔗</span>
REF

</a>


<a href="Interest-history.html">

<span>📈</span>
INTEREST

</a>


<a href="login.html">

<span>🚪</span>
OUT

</a>


</div>






<script>

const API="https://mobile-wealth-api.onrender.com";



document.addEventListener("DOMContentLoaded",()=>{


const user=JSON.parse(localStorage.getItem("user"));



if(!user || !user.phone){

window.location.href="login.html";

return;

}



document.getElementById("welcome").innerText=user.phone;




function formatMoney(amount){

return Number(amount || 0).toLocaleString();

}





async function loadBalance(){

try{

const res=await fetch(`${API}/balance/${user.phone}`);

const data=await res.json();


document.getElementById("balance").innerText=
"₦"+formatMoney(data.balance);


}catch(err){

console.log("Balance error:",err);

}

}





async function loadReturns(){

try{

const res=await fetch(`${API}/returns/${user.phone}`);

const data=await res.json();


document.getElementById("returns").innerText=
"₦"+formatMoney(data.returns || data.total);


}catch(err){

console.log("Returns error:",err);

}

}





async function loadInvested(){

try{

const res=await fetch(`${API}/total-invested/${user.phone}`);

const data=await res.json();


document.getElementById("totalInvested").innerText=
"₦"+formatMoney(data.total);


}catch(err){

console.log("Investment error:",err);

}

}





loadBalance();

loadReturns();

loadInvested();



setInterval(loadBalance,5000);

setInterval(loadReturns,5000);

setInterval(loadInvested,5000);


});







// REFERRAL


const userRef=JSON.parse(localStorage.getItem("user"));


if(userRef && userRef.referral_code){

const ref=document.getElementById("refLink");


if(ref){

ref.value=
`${location.origin}/signup.html?ref=${userRef.referral_code}`;

}

}





function copyLink(){

const input=document.getElementById("refLink");

input.select();

navigator.clipboard.writeText(input.value);

alert("Referral link copied");

}







// TIME


function updateTime(){

const now=new Date();


document.getElementById("date").innerText=
now.toLocaleDateString();



document.getElementById("time").innerText=
now.toLocaleTimeString();


}


updateTime();

setInterval(updateTime,1000);








// BONUS


async function claimBonus(){


const code=document.getElementById("bonusCode").value;


const user=JSON.parse(localStorage.getItem("user"));



try{


const res=await fetch(`${API}/claim-bonus`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

userId:user.id,

code

})


});


const msg=await res.text();


alert(msg);



}catch(err){

alert("Bonus failed");

}


}



</script>


</body>

</html>
