<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f7fb;
    overflow-x:hidden;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#0099ff,#0066cc);
    color:#fff;
    padding:16px;
    font-size:18px;
    font-weight:bold;
    text-align:left;
    position:sticky;
    top:0;
    z-index:10;
}

/* MAIN WRAPPER */
.container{
    padding:12px;
    padding-bottom:120px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

/* FULL WIDTH */
.full{
    grid-column:1 / -1;
}

/* CARDS */
.card{
    background:#8fd3f4;
    border-radius:16px;
    padding:14px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    overflow:hidden;
}

.card h2{
    margin:0;
    font-size:13px;
    color:#333;
}

.value{
    font-size:18px;
    font-weight:bold;
    margin-top:8px;
}

/* BUTTONS */
.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#0099ff;
    color:#fff;
    font-size:14px;
}

/* FIXED ELEMENTS SAFE */
.top-time{
    position:fixed;
    top:70px;
    right:10px;
    background:#fff;
    padding:6px 10px;
    border-radius:10px;
    font-size:12px;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

/* BONUS FIX (NO OVERLAP) */
#bonusBox{
    position:fixed;
    bottom:140px;
    right:10px;
    width:160px;
    background:#fff3cd;
    padding:10px;
    border-radius:12px;
    font-size:12px;
    z-index:50;
}

/* REF LINK */
.ref{
    background:#fff;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
}

.ref input{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:12px;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    display:flex;
    justify-content:space-around;
    padding:8px 0;
    border-top:1px solid #ddd;
    z-index:100;
}

.bottom-nav a{
    font-size:11px;
    text-align:center;
    text-decoration:none;
    color:#333;
    flex:1;
}

/* MOBILE FIX */
@media(max-width:480px){
    .grid{
        grid-template-columns:1fr;
    }

    #bonusBox{
        width:130px;
        font-size:11px;
    }
}
</style>

<div class="header">Welcome User</div>

<div class="top-time" id="clock"></div>

<div class="container">

    <div class="grid">

        <div class="card">
            <h2>Balance</h2>
            <div class="value">₦11159589</div>
        </div>

        <div class="card">
            <h2>Returns</h2>
            <div class="value">₦27500</div>
        </div>

        <div class="card full">
            <h2>Total Invested</h2>
            <div class="value">₦40000</div>
        </div>

        <div class="card full">
            <button class="btn">Deposit</button>
        </div>

        <div class="card full">
            <button class="btn">Withdraw</button>
        </div>

    </div>

    <div class="ref">
        <h3 style="margin:0 0 10px 0;">Referral Link</h3>
        <input readonly value="https://mobile-wealth-api.onrender.com/ref/12345">
    </div>

</div>

<div id="bonusBox">
🎁 Bonus<br>
<input style="width:100%;padding:6px;margin-top:5px;">
<button style="width:100%;margin-top:5px;background:#0099ff;color:#fff;border:none;padding:8px;border-radius:8px;">
Accept
</button>
</div>

<div class="bottom-nav">
    <a href="#">🏠<br>Home</a>
    <a href="#">💰<br>Deposit</a>
    <a href="#">💸<br>Withdraw</a>
    <a href="#">📊<br>History</a>
    <a href="#">🔗<br>Referral</a>
    <a href="#">Logout</a>
</div>
</body>

<script>
const API = "https://mobile-wealth-api.onrender.com";
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const user = JSON.parse(localStorage.getItem("user"));

    if (!user || !user.phone) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("welcome").innerText = user.phone;

    const balanceEl = document.getElementById("balance");

    function loadBalance() {
        fetch(`${API}/balance/${user.phone}`)
        .then(res => res.json())
        .then(data => {
            balanceEl.innerText = "₦" + (data.balance || 0);
        });
    }

    function loadReturns() {
        fetch(`${API}/returns/${user.phone}`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("returns").innerText =
                "₦" + (data.returns || data.total || 0);
        });
    }

    function loadInvested() {
        fetch(`${API}/total-invested/${user.phone}`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("totalInvested").innerText =
                "₦" + (data.total || 0);
        });
    }

    loadBalance();
    loadReturns();
    loadInvested();

    if (typeof checkInvestment === "function") {
        checkInvestment(user.phone);
    }

    setInterval(loadBalance, 3000);
    setInterval(loadReturns, 5000);
    setInterval(loadInvested, 5000);
});
</script>

<!-- REFERRAL -->
<script>
const userRef = JSON.parse(localStorage.getItem("user"));

if (!userRef || !userRef.phone) {
    window.location.href = "login.html";
}

const referralCode = userRef.referral_code;

const link = `${location.origin}/signup.html?ref=${referralCode}`;

document.getElementById("refLink").value = link;

function copyLink() {
    const input = document.getElementById("refLink");
    input.select();
    document.execCommand("copy");
    alert("Copied!");
}
</script>

<!-- TIME -->
<script>
function updateTime() {

    const now = new Date();

    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const months = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
    ];

    const dayName = days[now.getDay()];
    const day = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear();

    function suffix(d) {
        if (d > 3 && d < 21) return "th";
        switch (d % 10) {
            case 1: return "st";
            case 2: return "nd";
            case 3: return "rd";
            default: return "th";
        }
    }

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let ampm = hours >= 12 ? "pm" : "am";

    hours = hours % 12 || 12;
    minutes = minutes < 10 ? "0" + minutes : minutes;

    document.getElementById("date").innerText =
        `${dayName}, ${day}${suffix(day)} ${month}, ${year}
${hours}:${minutes} ${ampm}`;
}

updateTime();
setInterval(updateTime, 1000);
</script>

<!-- INVESTMENT CHECK + BONUS -->
<script>
async function checkInvestment(phone) {

    try {
        const res = await fetch(`${API}/user/has-active-investment/${phone}`);
        const data = await res.json();

        document.getElementById("bonusBox").style.display =
            data.active ? "block" : "none";

    } catch (err) {
        console.log(err);
    }
}

async function claimBonus() {

    const code = document.getElementById("bonusCode").value;
    const user = JSON.parse(localStorage.getItem("user"));

    const res = await fetch(`${API}/claim-bonus`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            userId: user.id,
            code
        })
    });

    const msg = await res.text();
    alert(msg);
}
</script>

</body>
</html>
