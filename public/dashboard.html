<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(135deg,#f5f7fb,#dcecff);

    overflow-x:hidden;

}


/* MAIN WELCOME CARD */

.welcome-card{

    width:100%;

    background:
    linear-gradient(135deg,#0099ff,#0066cc);

    color:white;

    padding:18px;

    border-radius:0 0 25px 25px;

    box-shadow:
    0 8px 20px rgba(0,0,0,.25);

    position:relative;

    overflow:hidden;

}


/* HEADER */

.header{

    display:flex;

    align-items:center;

    gap:12px;

}


/* PROFILE IMAGE */

.profile-icon img{

    width:45px;

    height:45px;

    background:white;

    border-radius:50%;

    padding:3px;

    box-shadow:
    0 0 10px rgba(255,255,255,.8);

}



/* WELCOME TEXT AREA */

.welcome-box{

    font-size:18px;

    font-weight:bold;

    letter-spacing:1px;

    text-shadow:
    2px 2px 5px rgba(0,0,0,.35);

    animation:welcomeGlow 2s infinite alternate;

}


.welcome-text{

    color:white;

}



.user-number{

    display:inline-block;

    margin-left:6px;

    font-size:18px;

    font-weight:bold;


    background:
    linear-gradient(
    45deg,
    #fff3a0,
    #ffcc00,
    #ffffff
    );


    background-clip:text;

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;


    text-shadow:
    2px 3px 5px rgba(0,0,0,.35);

}




@keyframes welcomeGlow{


from{

transform:translateY(0);

}


to{

transform:translateY(-3px);

}


}



/* MOBILE SIZE */

@media(max-width:600px){


.welcome-box{

    font-size:16px;

}


.user-number{

    font-size:16px;

}


}

/* AVIATOR CRYSTAL DIAMOND BUTTON */


.aviator-container{

    margin-top:25px;

    display:flex;

    justify-content:center;

    align-items:center;

}



.aviator-button{


    width:155px;

    height:155px;


    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;


    text-decoration:none;

    color:white;


    font-size:14px;

    font-weight:bold;


    position:relative;


    /* Crystal glass effect */

    background:

    linear-gradient(
    145deg,
    rgba(255,255,255,.85),
    rgba(190,230,255,.35),
    rgba(255,255,255,.08)
    );


    border:2px solid rgba(255,255,255,.9);



    /* Diamond shape */

    clip-path:polygon(

    50% 0%,

    100% 25%,

    100% 75%,

    50% 100%,

    0% 75%,

    0% 25%

    );


    backdrop-filter:blur(15px);


    box-shadow:

    0 0 20px white,

    0 0 45px #00d9ff,

    inset 0 0 30px white;


    animation:

    crystalFloat 3s infinite ease-in-out;


}



/* AVIATOR IMAGE */


.aviator-button img{


    width:65px;

    height:65px;


    object-fit:contain;


    margin-bottom:5px;


    filter:

    drop-shadow(0 0 15px gold);

}



/* TEXT */


.aviator-button span{


    text-align:center;


    line-height:18px;


    color:white;


    text-shadow:

    0 0 8px gold,

    0 0 15px black;


}



/* Crystal shining animation */


.aviator-button::before{


    content:"";


    position:absolute;


    top:-100%;


    left:-100%;


    width:80%;


    height:250%;


    background:

    linear-gradient(

    120deg,

    transparent,

    rgba(255,255,255,.8),

    transparent

    );


    transform:rotate(35deg);


    animation:

    crystalLight 3s infinite;


}




@keyframes crystalLight{


0%{

left:-120%;

}


50%{

left:120%;

}


100%{

left:120%;

}


}




@keyframes crystalFloat{


0%,100%{

transform:translateY(0);

}


50%{

transform:translateY(-8px);

}


}

/* FINAL CLEANUP */


/* CARD FIX */

.card{

    min-height:120px;

}



/* BONUS BOX FIX */

#bonusBox{

    width:150px;

    height:120px;

}



/* CONTAINER MOBILE FIX */


.container{

    width:100%;

    max-width:600px;

    margin:auto;

    padding:15px;

    padding-bottom:140px;

}




/* DASHBOARD CARDS */


.card{

    border-radius:15px;

    transition:.3s ease;

}


.card:hover{

    transform:translateY(-3px);

    box-shadow:

    0 8px 20px rgba(0,0,0,.15);

}




/* BOTTOM NAV IMPROVEMENT */


.bottom-nav{

    height:65px;

    align-items:center;

    box-shadow:

    0 -5px 15px rgba(0,0,0,.15);

}




.bottom-nav a{

    font-size:10px;

}




.bottom-nav span{

    font-size:18px;

}




/* MOBILE RESPONSIVE */


@media(max-width:600px){


.container{

    padding-left:10px;

    padding-right:10px;

}



.grid{

    grid-template-columns:1fr;

}



.full{

    grid-column:span 1;

}



.dashboard-ad img{

    height:150px;

}



.action-buttons button{

    width:120px;

    height:55px;

}



.aviator-button{

    width:145px;

    height:145px;

}



}



/* IMAGE SMOOTHNESS */


img{

    max-width:100%;

}



/* REMOVE HORIZONTAL SCROLL */


html,body{

    overflow-x:hidden;

}



</style>
</head>

<body>

<!-- HEADER + AVIATOR FEATURE -->

<div class="welcome-card">


    <!-- USER HEADER -->

    <div class="header">


        <div class="profile-icon">

            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
            alt="Profile">

        </div>



        <div class="welcome-box">

            <span class="welcome-text">
                Welcome
            </span>


            <span id="welcome" class="user-number"></span>

        </div>


    </div>



    <!-- AVIATOR GAME BUTTON -->

    <div class="aviator-container">


        <a href="/aviator.html" class="aviator-button">


            <img src="images/aviator.png" 
            alt="Aviator Game">



            <span>

                PLAY GAME<br>
                AND EARN

            </span>


        </a>


    </div>


</div>


<!-- DASHBOARD ADVERT -->

<div class="dashboard-ad">

<img id="advertImage"
src="images/investment1.jpeg"
alt="Mobile Wealth Advert">

</div>



<div class="top-time">

<div id="date"></div>

<div id="time"></div>

</div>




<div class="container">


<div class="grid">


<div class="card">

<h2>Balance</h2>

<div class="value" id="balance">₦0</div>

</div>



<div class="card">

<h2>Returns</h2>

<div class="value returns" id="returns">₦0</div>

</div>




<div class="card full">

<h2>Total Invested</h2>

<div class="value" id="totalInvested">₦0</div>

</div>


</div>



<!-- DEPOSIT AND WITHDRAW -->

<div class="action-buttons">

<button onclick="location.href='deposit.html'">
💰 Deposit
</button>


<button onclick="location.href='Withdraw.html'">
💸 Withdraw
</button>

</div>




<!-- BONUS + REFERRAL ROW -->

<div class="bonus-ref-row">


<div id="bonusBox">

<b>🎁 Bonus</b>

<br><br>

<input id="bonusCode" placeholder="Enter code">

<br><br>

<button onclick="claimBonus()">
Accept
</button>

</div>



<div class="ref-box">

<h3>Referral Link</h3>

<input id="refLink" readonly>

<br><br>

<button onclick="copyLink()">
Copy Link
</button>

</div>


</div>





<!-- NORMAL BUTTON AREA -->

<div class="action-links">


<a href="about.html" class="about-btn">
About
</a>


<a href="help.html" class="help-btn">
Forum
</a>


<a href="myinvestment.html" class="myinvestment-btn">
MY 🛍️ INVESTMENT
</a>


</div>








<!-- BOTTOM NAV -->

<div class="bottom-nav">


<a href="deposit.html">

<span>💰</span>
DEP

</a>


<a href="products.html">

<span>🛍️</span>
PRODUCT

</a>


<a href="Transactions.html">

<span>📊</span>
HISTORY

</a>


<a href="referral-commission.html">

<span>🔗</span>
REF

</a>


<a href="Interest-history.html">

<span>📈</span>
INTEREST

</a>


<a href="login.html">

<span>🚪</span>
OUT

</a>


</div>






<script>

const API="https://mobile-wealth-api.onrender.com";



document.addEventListener("DOMContentLoaded",()=>{


const user=JSON.parse(localStorage.getItem("user"));



if(!user || !user.phone){

window.location.href="login.html";

return;

}



document.getElementById("welcome").innerText=user.phone;




function formatMoney(amount){

return Number(amount || 0).toLocaleString();

}





async function loadBalance(){

try{

const res=await fetch(`${API}/balance/${user.phone}`);

const data=await res.json();


document.getElementById("balance").innerText=
"₦"+formatMoney(data.balance);


}catch(err){

console.log("Balance error:",err);

}

}





async function loadReturns(){

try{

const res=await fetch(`${API}/returns/${user.phone}`);

const data=await res.json();


document.getElementById("returns").innerText=
"₦"+formatMoney(data.returns || data.total);


}catch(err){

console.log("Returns error:",err);

}

}





async function loadInvested(){

try{

const res=await fetch(`${API}/total-invested/${user.phone}`);

const data=await res.json();


document.getElementById("totalInvested").innerText=
"₦"+formatMoney(data.total);


}catch(err){

console.log("Investment error:",err);

}

}





loadBalance();

loadReturns();

loadInvested();



setInterval(loadBalance,5000);

setInterval(loadReturns,5000);

setInterval(loadInvested,5000);


});







// REFERRAL


const userRef=JSON.parse(localStorage.getItem("user"));


if(userRef && userRef.referral_code){

const ref=document.getElementById("refLink");


if(ref){

ref.value=
`${location.origin}/signup.html?ref=${userRef.referral_code}`;

}

}





function copyLink(){

const input=document.getElementById("refLink");

input.select();

navigator.clipboard.writeText(input.value);

alert("Referral link copied");

}







// TIME


function updateTime(){

const now=new Date();


document.getElementById("date").innerText=
now.toLocaleDateString();



document.getElementById("time").innerText=
now.toLocaleTimeString();


}


updateTime();

setInterval(updateTime,1000);








// BONUS


async function claimBonus(){


const code=document.getElementById("bonusCode").value;


const user=JSON.parse(localStorage.getItem("user"));



try{


const res=await fetch(`${API}/claim-bonus`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

userId:user.id,

code

})


});


const msg=await res.text();


alert(msg);



}catch(err){

alert("Bonus failed");

}


}



</script>

<script>
    // ELECTRONIC BILLBOARD ADVERT SLIDER

const adverts = [

"images/investment1.jpeg",

"images/investment6.jpeg",

"images/investment2.jpeg",

"images/investment3.jpeg",

"images/investment4.jpeg",

"images/investment7.jpeg",

"images/investment5.jpeg"

];


let advertIndex = 0;


setInterval(()=>{


advertIndex++;


if(advertIndex >= adverts.length){

advertIndex = 0;

}



document.getElementById("advertImage").src =
adverts[advertIndex];


},10000); // change every 10 seconds
</script>


</body>

</html>
