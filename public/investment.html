<!DOCTYPE html>
<html>
<head>
    <title>My Investments</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .active {
            color: #00ff99;
            font-weight: bold;
        }

        .inactive {
            color: #ff4444;
            font-weight: bold;
        }

        .row {
            margin: 5px 0;
        }
    </style>
</head>

<body>

<h2>📊 My Investments</h2>

<div id="container"></div>

<script>

const API = "https://mobile-wealth-api.onrender.com";

const user = JSON.parse(localStorage.getItem("user"));

if (!user || !user.phone) {
    window.location.href = "login.html";
}

async function loadMyInvestments() {

    try {

        const res = await fetch(`${API}/investments/user/${user.phone}`);
        const data = await res.json();

        const container = document.getElementById("container");
        container.innerHTML = "";

        if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = "<p style='text-align:center;'>No investments found</p>";
            return;
        }

        data.forEach(inv => {

            const statusClass = inv.status === "active" ? "active" : "inactive";

            container.innerHTML += `
                <div class="card">
                    <div class="row">💰 Amount: ₦${Number(inv.amount).toFixed(2)}</div>
                    <div class="row">📈 Daily Interest: ₦${Number(inv.daily_interest).toFixed(2)}</div>
                    <div class="row">📅 Start: ${new Date(inv.created_at).toLocaleString()}</div>
                    <div class="row">⏳ End: ${inv.end_date ? new Date(inv.end_date).toLocaleString() : "N/A"}</div>
                    <div class="row ${statusClass}">Status: ${inv.status}</div>
                </div>
            `;
        });

    } catch (err) {
        console.log("Load error:", err);
    }
}

loadMyInvestments();

</script>

</body>
</html>
