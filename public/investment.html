<!DOCTYPE html>
<html>
<head>
    <title>My Investments</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .active {
            color: #00ff99;
            font-weight: bold;
        }

        .inactive {
            color: #ff4444;
            font-weight: bold;
        }

        .row {
            margin: 5px 0;
        }
    </style>
</head>

<body>

<h2>📊 My Investments</h2>

<div id="container"></div>

<!-- MOBILE BOTTOM NAV -->
<div class="bottom-nav">
    <a href="dashboard.html">Home</a>
</div>

<script>

const API = "https://mobile-wealth-api.onrender.com";

const user = JSON.parse(localStorage.getItem("user"));

if (!user || !user.id) {
    window.location.href = "login.html";
}

async function loadMyInvestments() {

    try {

        // ✅ FIX: use user.id instead of phone
        const res = await fetch(`${API}/investments/user/${user.id}`);
        const data = await res.json();

        const container = document.getElementById("container");

        if (!container) {
            console.log("Container not found");
            return;
        }

        container.innerHTML = "";

        if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = "<p style='text-align:center;'>No investments found</p>";
            return;
        }

        data.forEach(inv => {

            // ✅ SAFE status check
            const status = (inv.status || "").toLowerCase();
            const statusClass = status === "active" ? "active" : "inactive";

            // ✅ SAFE number handling
            const amount = Number(inv.amount || 0);
            const interest = Number(inv.daily_interest || 0);

            container.innerHTML += `
                <div class="card">
                    <div class="row">💰 Amount: ₦${amount.toFixed(2)}</div>
                    <div class="row">📈 Daily Interest: ₦${interest.toFixed(2)}</div>
                    <div class="row">📅 Start: ${new Date(inv.created_at).toLocaleString()}</div>
                    <div class="row">⏳ End: ${inv.end_date ? new Date(inv.end_date).toLocaleString() : "N/A"}</div>
                    <div class="row ${statusClass}">
                        Status: ${status.toUpperCase()}
                    </div>
                </div>
            `;
        });

    } catch (err) {
        console.log("Load error:", err);
    }
}

loadMyInvestments();

</script>

</body>
</html>
