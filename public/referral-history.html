<!DOCTYPE html>
<html>
<head>
<title>Referral History</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef3f9;
}

/* TOP BAR */
.topbar{
    background:linear-gradient(135deg,#0099ff,#0066ff);
    color:white;
    padding:16px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    position:sticky;
    top:0;
}

/* CONTAINER */
#history{
    padding:12px;
    padding-bottom:80px;
}

/* CARD STYLE */
.card{
    background:white;
    margin-bottom:12px;
    padding:14px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

/* TEXT */
.user{
    font-size:15px;
    font-weight:bold;
    margin-bottom:6px;
}

.amount{
    color:#00c853;
    font-weight:bold;
    margin-bottom:6px;
}

.date{
    font-size:12px;
    color:#777;
}

/* EMPTY STATE */
.empty{
    text-align:center;
    color:#888;
    margin-top:30px;
}

/* BOTTOM BUTTON */
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    border-top:1px solid #ddd;
    text-align:center;
}

.bottom a{
    display:block;
    padding:14px;
    text-decoration:none;
    color:white;
    background:#0099ff;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="topbar">
Referral History
</div>

<div id="history"></div>

<div class="bottom">
    <a href="dashboard.html">⬅️ Back to Dashboard</a>
</div>

<script>
const API = "https://mobile-wealth-api.onrender.com";

const user = JSON.parse(localStorage.getItem("user"));

if (!user || !user.id) {
    window.location.href = "login.html";
}

async function loadReferralHistory() {

    try {

        const res = await fetch(`${API}/referral-history/${user.id}`);

        const data = await res.json();

        const container = document.getElementById("history");

        container.innerHTML = "";

        if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = <p class="empty">No referral earnings yet</p>;
            return;
        }

        data.forEach(item => {

            container.innerHTML += `
                <div class="card">
                    <div class="user">👤 ${item.referred_user || "Unknown"}</div>
                    <div class="amount">💰 ₦${Number(item.amount || 0).toFixed(2)}</div>
                    <div class="date">📅 ${new Date(item.created_at).toLocaleString()}</div>
                </div>
            `;
        });

    } catch (err) {
        console.log(err);
        document.getElementById("history").innerHTML =
            <p class="empty">Failed to load referral history</p>;
    }
}

document.addEventListener("DOMContentLoaded", loadReferralHistory);
</script>

</body>
</html>
