<!DOCTYPE html>
<html>
<head>
    <title>AI Support Chat</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #111827;
        }

        .header h3 {
            margin: 0;
        }

        .home-btn {
            background: #22c55e;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        /* CHAT BOX */
        .chat-box {
            height: 70vh;
            overflow-y: auto;
            padding: 10px;
        }

        .msg {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
        }

        .user {
            background: #22c55e;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #1e293b;
        }

        /* INPUT AREA */
        .input-box {
            display: flex;
            padding: 10px;
            background: #111827;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 6px;
        }

        button.send {
            margin-left: 10px;
            padding: 12px 15px;
            border: none;
            background: #3b82f6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h3>🤖 AI Support</h3>
    <button class="home-btn" onclick="goHome()">🏠 Home</button>
</div>

<!-- CHAT -->
<div class="chat-box" id="chatBox"></div>

<!-- INPUT -->
<div class="input-box">
    <input type="text" id="input" placeholder="Type your message...">
    <button class="send" onclick="send()">Send</button>
</div>

<script>

const API = "https://mobile-wealth-api.onrender.com";

/* HOME BUTTON */
function goHome() {
    window.location.href = "dashboard.html";
}

/* ADD MESSAGE TO UI */
function addMessage(text, type) {

    const chatBox = document.getElementById("chatBox");

    chatBox.innerHTML += `
        <div class="msg ${type}">
            ${text}
        </div>
    `;

    chatBox.scrollTop = chatBox.scrollHeight;
}

/* SEND MESSAGE */
async function send() {

    const input = document.getElementById("input");
    const msg = input.value.trim();

    if (!msg) return;

    // show user message
    addMessage(msg, "user");

    input.value = "";

    // call backend AI
    try {

        const res = await fetch(`${API}/chat-ai`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: msg,
                userId: JSON.parse(localStorage.getItem("user"))?.id
            })
        });

        const data = await res.json();

        if (data.reply) {
            addMessage(data.reply, "bot");
        } else {
            addMessage("AI error. Try again later.", "bot");
        }

    } catch (err) {
        console.log(err);
        addMessage("Network error. Please try again.", "bot");
    }
}

</script>

</body>
</html>
