<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mobile Wealth Aviator</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<style>

body{

    margin:0;
    font-family:Arial, sans-serif;
    background:#080808;
    color:white;
    text-align:center;

}


.container{

    max-width:420px;
    margin:auto;
    padding:20px;

}



h1{

    color:#ffcc00;

}



.wallet{

    background:#151515;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;

}



.game{

    height:250px;
    background:#111;
    border-radius:20px;
    position:relative;
    overflow:hidden;

}



.plane{

    font-size:50px;
    position:absolute;
    bottom:20px;
    left:20px;

    transition:0.2s;

}



.multiplier{

    font-size:55px;
    font-weight:bold;
    margin-top:70px;
    color:#00ff88;

}



.crash{

    color:red;

}



input{

    width:90%;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
    border:none;
    font-size:18px;

}



button{

    width:90%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;

}



.bet{

    background:#00c853;
    color:white;

}



.cash{

    background:#ff9800;
    color:white;

}



.status{

    margin-top:15px;
    color:#aaa;

}

</style>

</head>


<body>


<div class="container">


<h1>✈️ Aviator</h1>



<div class="wallet">

Game Wallet:

<h2 id="wallet">
0.00
</h2>

</div>




<div class="game">


<div class="multiplier" id="multiplier">

1.00x

</div>


<div class="plane" id="plane">

✈️

</div>


</div>




<input 
id="amount"
type="number"
placeholder="Enter bet amount">



<button class="bet" onclick="placeBet()">

BET

</button>



<button class="cash" onclick="cashOut()">

CASH OUT

</button>




<div class="status" id="status">

Waiting for round...

</div>



</div>

<script>

// Your Render API
const API = 
"https://mobile-wealth-api.onrender.com";


// Get logged in user phone

const user = JSON.parse(localStorage.getItem("user"));

const phone = user ? user.phone : null;



// Socket connection

const socket = io(API);



let currentMultiplier = 1;

let bettingOpen = false;




// Betting countdown started

socket.on("bettingStart",(data)=>{


bettingOpen = true;


document.getElementById("status").innerHTML =
"Betting open: " + data.seconds + "s";


});





// Betting countdown update

socket.on("bettingCountdown",(data)=>{


bettingOpen = true;


document.getElementById("status").innerHTML =
"Place bet: " + data.seconds + "s";


});





// Game started

socket.on("gameStart",(data)=>{


bettingOpen = false;


document.getElementById("status").innerHTML =
"Round Started";


document.getElementById("multiplier").innerHTML =
"1.00x";

});




// Multiplier update

socket.on("multiplier",(data)=>{


currentMultiplier = data.value;


document.getElementById("multiplier").innerHTML =
data.value;



// move plane

let move =
parseFloat(data.value)*100;


document.getElementById("plane").style.left =
move+"px";

});




// Crash

socket.on("crashed",(data)=>{


bettingOpen = false;


document.getElementById("multiplier").innerHTML =
data.value;



document.getElementById("multiplier").className =
"multiplier crash";



document.getElementById("status").innerHTML =
"CRASHED";

});





// Place bet

function placeBet(){



if(!phone){

alert("User not logged in");

return;

}



let amount =
document.getElementById("amount").value;



console.log({

phone: phone,

amount: amount

});



if(!amount || amount <= 0){

alert("Enter amount");

return;

}





fetch(API+"/aviator/bet",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

phone:phone,

amount:Number(amount)

})

})


.then(res=>res.json())

.then(data=>{


alert(data.message || data);



});


}






// Cashout

function cashOut(){



fetch(API+"/aviator/cashout",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

phone:phone

})

})


.then(res=>res.json())

.then(data=>{


alert(
data.message
);


});


}


// FUND AVIATOR GAME WALLET

function fundAviatorWallet(){


let amount = document.getElementById("fundAmount").value;


if(!phone){

alert("User not logged in");

return;

}



if(!amount || amount <= 0){

alert("Enter valid amount");

return;

}



fetch(API + "/aviator/fund",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

phone: phone,

amount: Number(amount)

})

})


.then(res=>res.json())

.then(data=>{


alert(data.message || "Fund completed");


})


.catch(err=>{


console.log(err);

alert("Network error");


});


}
</script>


</body>

</html>
